# Publish this package to npm with Trusted Publishing (OIDC).
#
# No NPM_TOKEN secret is involved: GitHub mints a short-lived OIDC token and npm
# accepts it because the package's trusted publisher is bound to this
# repository + this workflow file. Provenance is generated automatically.
#
# One-time npm-side configuration (the package must already exist on the
# registry — npm, unlike PyPI, cannot pre-register a trusted publisher for a
# name that has never been published):
#   npmjs.com -> package -> Settings -> Trusted publishing -> GitHub Actions
#     Organization or user : hoist-wen
#     Repository           : dsh-trajectory-tool-insight
#     Workflow filename    : publish.yml
#     Environment          : (leave empty)
#
# Two entry points:
# - pushing a `v*` tag publishes that tag (after checking it matches
#   package.json's version);
# - running the workflow manually publishes the version currently on the
#   chosen branch.
#
# `id-token: write` is what makes the OIDC exchange possible — without it the
# registry rejects the publish.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `registry-url` on purpose: it makes setup-node write an .npmrc with a
      # placeholder _authToken (plus the deprecated `always-auth` key), i.e. the
      # token-based path Trusted Publishing exists to remove.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Node 22 ships npm 10.x, which predates Trusted Publishing.
      # OIDC publishing needs npm >= 11.5.1, so upgrade before publishing.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Tag and package.json must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      # TEMPORARY diagnostic: print the OIDC subject npm will present, and the
      # raw response from the registry's token-exchange endpoint. Delete once
      # publishing is green.
      - name: Debug OIDC claims
        run: |
          node -e '
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=npm:registry.npmjs.org";
            const auth = "bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            fetch(url, { headers: { Authorization: auth } })
              .then((r) => r.json())
              .then(async (j) => {
                const payload = JSON.parse(Buffer.from(j.value.split(".")[1], "base64url"));
                const keep = ["sub", "repository", "repository_owner", "workflow_ref", "ref", "event_name", "environment"];
                console.log("claims:", JSON.stringify(Object.fromEntries(keep.map((k) => [k, payload[k] ?? null])), null, 2));
                const pkg = encodeURIComponent("@hoist-wen/dsh-trajectory-tool-insight");
                const res = await fetch("https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/" + pkg, {
                  method: "POST",
                  headers: { Authorization: auth },
                });
                console.log("exchange status:", res.status);
                console.log("exchange body:", (await res.text()).slice(0, 800));
              })
              .catch((e) => { console.error("debug failed:", e.message); process.exit(1); });
          '

      # No NODE_AUTH_TOKEN on purpose: npm notices the OIDC environment and
      # exchanges the GitHub-issued identity for registry credentials itself.
      - name: Publish
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org --loglevel=verbose

      - name: Summarize
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "Published @hoist-wen/dsh-trajectory-tool-insight@$version"
            echo "https://www.npmjs.com/package/@hoist-wen/dsh-trajectory-tool-insight/v/$version"
          } >> "$GITHUB_STEP_SUMMARY"
